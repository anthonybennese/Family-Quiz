<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Quiz</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .start-box {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 15px gray;
            text-align: center;
            width: 500px;
        }

        h1 {
            color: darkblue;
            font-size: 50px;
            margin-bottom: 10px;
        }

        p {
            font-size: 20px;
            color: #555;
            margin-bottom: 25px;
        }

        button {
            background-color: blue;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 24px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkblue;
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="start-box">
        <h1>Family Quiz</h1>

        <p>
            Test your knowledge of the family
        </p>

        <button id="startQuiz">Start Quiz</button>
    </div>

    <script>
        let startQuiz = document.getElementById("startQuiz");

        startQuiz.addEventListener("click", function() {
            window.location.href = "QuestionOne.html";
        });
    </script>
</body>
</html>
